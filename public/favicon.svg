<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="gp-box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9D81" />
      <stop offset="0.5" stop-color="#E64B45" />
      <stop offset="1" stop-color="#C4477E" />
    </linearGradient>
    <linearGradient id="gp-rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8" />
      <stop offset="1" stop-color="#FFD074" />
    </linearGradient>
  </defs>

  <!-- body, then the lid overhanging it slightly -->
  <rect x="8" y="20" width="24" height="15" rx="3" fill="url(#gp-box)" />
  <rect x="8" y="21.4" width="24" height="1.6" fill="rgba(60,15,20,0.18)" />
  <rect x="6" y="15" width="28" height="7" rx="2.4" fill="url(#gp-box)" />
  <rect x="6" y="15" width="28" height="7" rx="2.4" fill="rgba(255,255,255,0.14)" />
  <rect x="7.2" y="15.6" width="25.6" height="1.3" rx="0.65" fill="rgba(255,255,255,0.35)" />

  <!-- ribbon over lid and body -->
  <rect x="18" y="15" width="4" height="20" fill="url(#gp-rib)" />
  <rect x="18" y="21.4" width="4" height="1.6" fill="rgba(120,60,30,0.18)" />

  <!-- bow on the lid -->
  <path d="M20 15 C 15 8.5, 8 9, 9.2 13.4 C 10 16, 15 16, 20 15 Z" fill="url(#gp-rib)" />
  <path d="M20 15 C 25 8.5, 32 9, 30.8 13.4 C 30 16, 25 16, 20 15 Z" fill="url(#gp-rib)" />
  <path d="M20 15 C 16.5 14.6, 13.5 13.8, 12 12.6 C 13.6 14.4, 16.8 15.5, 20 15.6 Z" fill="rgba(120,60,30,0.22)" />
  <path d="M20 15 C 23.5 14.6, 26.5 13.8, 28 12.6 C 26.4 14.4, 23.2 15.5, 20 15.6 Z" fill="rgba(120,60,30,0.22)" />
  <rect x="17.8" y="12.6" width="4.4" height="4.8" rx="1.3" fill="#FFD074" stroke="rgba(120,60,30,0.22)" stroke-width="0.4" />
</svg>
